name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - work
  pull_request:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.4

      - name: Build debug APK
        env:
          BODS_API_KEY: ${{ secrets.BODS_API_KEY }}
          BODS_BOUNDING_BOX: ${{ vars.BODS_BOUNDING_BOX }}
          BODS_API_BASE_URL: ${{ vars.BODS_API_BASE_URL }}
          GOOGLE_DIRECTIONS_API_KEY: ${{ secrets.GOOGLE_DIRECTIONS_API_KEY }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bus-times-live-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
