# Required because ARCore pulls AndroidX annotation through its runtime metadata.
android.useAndroidX=true

# Keep generated resources namespaced for faster, safer Android builds.
android.nonTransitiveRClass=true

# CI-friendly Gradle defaults.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.daemon=false

# Suppress JDK 21 warning for AGP Java 8 source/target defaults.
android.javaCompile.suppressSourceTargetDeprecationWarning=true
